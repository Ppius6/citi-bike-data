server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://agent-api:8000/api/;
        proxy_set_header Host $host;
        # Default 60s is too short for slower/"thinking" models working through
        # several tool-calling rounds on an open-ended question — latency is
        # highly variable (seen 150s-260s successful, one 300s+ timeout) with
        # qwen3.8-max via CometAPI, so this leaves real headroom over the worst case.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
