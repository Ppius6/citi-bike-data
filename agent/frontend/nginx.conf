server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://agent-api:8000/api/;
        proxy_set_header Host $host;
        # Default 60s is too short for several tool-calling rounds; the agent
        # enforces its own 120s request budget, so this leaves headroom over it.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        try_files $uri /index.html;
    }
}
